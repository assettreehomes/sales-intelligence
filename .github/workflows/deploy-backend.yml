name: Deploy backend

# Deploys the backend to Cloud Run after every change to main that touches it.
# Google Cloud trusts this repository's main branch through Workload Identity
# Federation, so no key or password is stored anywhere (set up once with
# scripts/setup-github-deploy.sh). The build itself is the same cloudbuild.yaml
# a manual `gcloud builds submit` uses.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'cloudbuild.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node --check src/index.js
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/123251903795/locations/global/workloadIdentityPools/github/providers/github
          service_account: gha-deployer@mystical-melody-486113-p0.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy to Cloud Run
        run: gcloud builds submit --config cloudbuild.yaml --project mystical-melody-486113-p0 --gcs-source-staging-dir gs://mystical-melody-486113-p0_cloudbuild/source --suppress-logs .
      - name: Check the service answers
        run: curl -sf https://sales-intelligence-123251903795.asia-south1.run.app/health
